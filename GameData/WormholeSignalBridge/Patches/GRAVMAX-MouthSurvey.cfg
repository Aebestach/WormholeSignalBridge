// Adds wormhole mouth survey to GRAVMAX without replacing stock gravityScan.
// ModuleWormholeMouthSurvey (below): survey requirements PAW, location gating, mouth discovery — all paths.
// Science experiment: stock ModuleScienceExperiment when FeatureScience is off;
// Kerbalism Experiment when FeatureScience is on (see Kerbalism-MouthSurvey.cfg).

@PART[sensorGravimeter]:FOR[WormholeSignalBridge]
{
	MODULE
	{
		name = ModuleWormholeMouthSurvey
	}
}

@PART[sensorGravimeter]:NEEDS[!FeatureScience]:FOR[WormholeSignalBridge]
{
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = WSB_wormholeMouthSurvey
		experimentActionName = #LOC_WSB_experimentTitle
		resetActionName = #autoLOC_502064
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		dataIsCollectable = True
		collectActionName = #LOC_WSB_experimentCollect
		rerunnable = True
	}
}

// Per-antenna one-click mouth aim on RealAntennas parts (WSB UI, not RA UI).
@PART[*]:HAS[@MODULE[ModuleRealAntenna]]:FOR[WormholeSignalBridge]
{
	MODULE
	{
		name = ModuleWormholeMouthAiming
	}
}
