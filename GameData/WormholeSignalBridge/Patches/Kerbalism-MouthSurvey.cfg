// Kerbalism science rework compatibility for WSB wormhole mouth survey.
// Adds a second Experiment module on GRAVMAX; does not touch gravityScan.

@KERBALISM_EXPERIMENT_VALUES:FOR[WormholeSignalBridge]
{
	WSB
	{
		wormholeMouthSurvey
		{
			ECCost = 0.08
			size = 1200
			value = 50
			duration = 21600
			requirements =
			ResourceRates =
		}
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[WSB_wormholeMouthSurvey]]:NEEDS[FeatureScience]:FOR[WormholeSignalBridge]
{
	@baseValue = #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/value$
	@dataScale = #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/size$
	@dataScale /= #$baseValue$

	KERBALISM_EXPERIMENT
	{
		Situation = InSpaceLow
		Situation = InSpaceHigh
	}
}

@PART[sensorGravimeter]:NEEDS[FeatureScience]:FOR[WormholeSignalBridge]
{
	MODULE
	{
		name = Experiment
		experiment_id = WSB_wormholeMouthSurvey
	}
}

@MODULE[Experiment]:HAS[#experiment_id[WSB_wormholeMouthSurvey]]:NEEDS[FeatureScience]:FOR[WormholeSignalBridge]
{
	%ec_rate = #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/ECCost$
	%data_rate = #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/size$
	@data_rate /= #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/duration$
}
