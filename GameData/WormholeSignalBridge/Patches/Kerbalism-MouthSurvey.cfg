// Kerbalism science path for WSB wormhole mouth survey (requires FeatureScience).
// Same flow as stock: ModuleWormholeMouthSurvey handles survey UI, location gating, and mouth discovery;
// this file only swaps in Kerbalism's Experiment module instead of ModuleScienceExperiment.
// Does not replace stock/Kerbalism gravityScan.

@KERBALISM_EXPERIMENT_VALUES:NEEDS[FeatureScience]:FOR[WormholeSignalBridge]
{
	WSB
	{
		wormholeMouthSurvey
		{
			ECCost = 3.5	
			size = 10240
			value = 66
			duration = 2938629
		}
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[WSB_wormholeMouthSurvey]]:NEEDS[FeatureScience]:FOR[zzzKerbalismDefault]
{
	@baseValue = #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/value$
	@scienceCap = #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/value$
	@dataScale = #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/size$
	@dataScale /= #$baseValue$

	KERBALISM_EXPERIMENT
	{
		Situation = InSpaceLow
		Situation = InSpaceHigh
	}
}

@PART[sensorGravimeter]:NEEDS[FeatureScience]:FOR[WormholeSignalBridge]
{
	MODULE
	{
		name = Experiment
		experiment_id = WSB_wormholeMouthSurvey
		ec_rate = #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/ECCost$
		data_rate = #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/size$
		@data_rate /= #$@KERBALISM_EXPERIMENT_VALUES/WSB/wormholeMouthSurvey/duration$
	}
}
