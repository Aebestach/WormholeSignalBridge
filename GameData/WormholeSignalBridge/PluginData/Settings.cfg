// Global defaults for wormhole comm tunnel links.
// Distance through the wormhole is NOT the physical separation in space.
WormholeBridgeSettings
{
	// Master switch for injected wormhole links.
	enabled = true

	// Equivalent RF path length through the wormhole (meters).
	// Very small values approximate distance-independent tunnel links.
	effectiveDistance = 1000

	// Extra attenuation through the wormhole throat (dB). 0 = no added loss.
	insertionLoss = 0

	// Log each injected link to KSP.log
	debugLogging = false
}
