		#LOC_WSB_sciResult_default = Against the quiet noise floor, the wormhole mouth resonance scanner suddenly pulls a thin negative-gravioli line—like someone plucked an invisible string in vacuum. The resonance drifts for hours yet stays pinned to one side of the body: no crater, no mass anomaly, only a gradient that folds back on itself. Mission Control logs the fixed phase as a wormhole mouth fix; any directional relay dish that wants to cross must keep its antenna trained on that spot.

		#LOC_WSB_sciResult_unknownParent = unknown parent body
		#LOC_WSB_sciResult_body = In orbit of <<1>>, the wormhole mouth resonance scanner hears a hum that should not exist: steady pitch, faint suction, as if the sensor were listening to a throat not yet opened. Data collapse to a razor-thin isophase band on the <<2>>-facing limb—geometry without a lump. The science officer’s note reads: “Not a hole. A latch.” Mouth coordinates are archived for one-click antenna aim.
		#LOC_WSB_sciResult_bodyWithPartner = In orbit of <<1>>, the wormhole mouth resonance scanner hears a hum that should not exist: steady pitch, faint suction, as if the sensor were listening to a throat not yet opened. Data collapse to a razor-thin isophase band on the <<2>>-facing limb—geometry without a lump. The science officer’s note reads: “Not a hole. A latch.” Cross-check with the paired wormhole <<3>> shows a mirrored resonance consistent with a linked throat. The mouth sits on the same parent-facing skin, a button pressed into spacetime. We still cannot see inside the throat—but the link budget already has; the relay only needs to turn its dish. Mouth coordinates are archived for one-click antenna aim.
