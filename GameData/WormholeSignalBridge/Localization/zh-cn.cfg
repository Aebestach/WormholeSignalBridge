		#LOC_WSB_sciResult_default = 虫洞口共振扫描仪的读数在平稳背景噪声里突然拉出一条细而长的负引力子谱线——像有人在真空中拨动了一根看不见的弦。共振峰在几小时内缓慢漂移，却始终锚定在同一侧球面：那里没有可见的撞击坑，也没有质量异常，但引力梯度在悄悄「向内折返」。任务中心将这一固定相位记录为虫洞口候选坐标；若要在定向中继抛物面天线上建立穿越链路，天线必须长期瞄准该点。

		#LOC_WSB_sciResult_unknownParent = 未知中心天体
		#LOC_WSB_sciResult_body = 环绕 <<1>> 的勘测中，虫洞口共振扫描仪捕获到一串几乎不合常理的负引力子哼鸣：频率稳定，却带着轻微的「吸入感」，仿佛仪器不是在测量引力，而是在监听某个尚未张开的喉道。数据在 <<2>> 一侧球面外缘收敛于一条极窄的等相位带——没有质量团块，只有几何上的「折痕」。科学官的备注只有一句：「这里不是洞，是门闩。」已将洞口坐标写入发现列表，可供定向天线一键瞄准。
		#LOC_WSB_sciResult_bodyWithPartner = 环绕 <<1>> 的勘测中，虫洞口共振扫描仪捕获到一串几乎不合常理的负引力子哼鸣：频率稳定，却带着轻微的「吸入感」，仿佛仪器不是在测量引力，而是在监听某个尚未张开的喉道。数据在 <<2>> 一侧球面外缘收敛于一条极窄的等相位带——没有质量团块，只有几何上的「折痕」。科学官的备注只有一句：「这里不是洞，是门闩。」已与对端虫洞天体 <<3>> 的读数交叉比对，相位关系吻合成对虫洞结构。扫描图显示洞口贴在本体朝向伴星的一侧，像一枚被按进时空薄膜的纽扣。我们尚不能目视喉道内部，但链路预算已经「看见」了它——只要中继站愿意把抛物面天线转过去。已将洞口坐标写入发现列表，可供定向天线一键瞄准。
